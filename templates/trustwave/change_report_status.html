{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Change Report Status</h5>
                </div>
                <div class="card-body">
                    <p class="mb-4">Current status: <strong>{% if current_status == 'active' %}Active{% else %}Inactive{% endif %}</strong></p>
                    
                    <form method="post" action="{% url 'trustwave:change_report_status' report.id %}" class="mb-3">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">New Status</label>
                            <select name="status" class="form-select">
                                <option value="">Select new status</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Change Status</button>
                            <a href="{% url 'trustwave:report_detail' report.pk %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
